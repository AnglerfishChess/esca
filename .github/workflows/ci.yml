name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The wheel is built from the crate by maturin, so this job needs cargo.
    # Every Python test needs the built `esca`, so they all run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # `-n auto` overrides the local `-n 4` of the pytest addopts.
      - run: uv run --no-sync pytest -n auto
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pyrefly check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to the crate's rust-version so clippy findings are reproducible.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test
      - run: cargo test --features lichess
      - run: cargo test --features openings
      - run: cargo test --features pgn
      - run: cargo test --features polyglot
      - run: cargo test --features uci
      - run: cargo test --features tokio
      - run: cargo test --all-features
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  perft:
    # Billions of nodes: once per run, not once per platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -- --ignored

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
      - name: Every dependency carries a permissive licence
        run: |
          cat > check_licences.py <<'PY'
          import json, sys

          ALLOWED = {
              "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
              "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "BSL-1.0",
              "Unlicense", "0BSD", "CC0-1.0",
          }

          bad = []
          for package in json.load(sys.stdin)["packages"]:
              expression = (package.get("license") or "").replace("/", " OR ")
              terms = [t.strip(" ()") for t in expression.split(" OR ")]
              if not any(t in ALLOWED for t in terms):
                  bad.append("%s %s | %s" % (package["name"], package["version"],
                                             package.get("license")))
          print("\n".join(bad) if bad else "every dependency is permissive")
          sys.exit(1 if bad else 0)
          PY
          cargo metadata --format-version 1 --all-features | python3 check_licences.py

  mcp:
    # `mcp/` takes esca from the crate beside it, so its sync builds the
    # extension and this job needs the toolchain the wheels are built with.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # One release ships the crate and the server, so five copies of the
      # version have to agree before a tag freezes any of them.
      - name: The crate's version, the server's, its pin and the registry entry
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, re, sys, tomllib

          want = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          project = tomllib.load(open("mcp/pyproject.toml", "rb"))["project"]
          listing = json.load(open("mcp/server.json"))
          pinned = next(name for name in project["dependencies"] if name.startswith("esca"))
          module = open("mcp/chess_esca_mcp/__init__.py").read()

          found = {
              "mcp/pyproject.toml version": project["version"],
              "mcp/pyproject.toml esca pin": pinned.removeprefix("esca=="),
              "mcp/server.json version": listing["version"],
              "mcp/server.json package version": listing["packages"][0]["version"],
              "chess_esca_mcp.__version__": re.search(r'__version__ = "([^"]+)"', module).group(1),
          }
          drifted = {where: value for where, value in found.items() if value != want}
          print("\n".join(f"{where}: {value}, not {want}" for where, value in drifted.items())
                or f"every copy of the version reads {want}")
          sys.exit(1 if drifted else 0)
          PY

      - run: uv sync --all-groups
      - run: uv run --no-sync pytest
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pyrefly check
