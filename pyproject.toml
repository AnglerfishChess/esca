[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "esca"
description = "A chess model that answers what is true about a position: variants, positions, games, and move text."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Myodov", email = "amyodov@gmail.com" },
]
keywords = ["chess", "chess960", "fen", "san", "position"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/AnglerfishChess/esca"
Repository = "https://github.com/AnglerfishChess/esca"
Documentation = "https://github.com/AnglerfishChess/esca/blob/main/docs/esca-api.md"
Changelog = "https://github.com/AnglerfishChess/esca/blob/main/CHANGELOG.md"
Issues = "https://github.com/AnglerfishChess/esca/issues"

[tool.maturin]
python-source = "python"
module-name = "esca._esca"
features = ["python", "lichess", "openings", "pgn", "polyglot", "uci", "pyo3/extension-module"]

[dependency-groups]
dev = [
    # The floor of the supported range, so the suite exercises the NumPy 1 API.
    "numpy>=1.26,<2",
    "pytest>=8.3.5",
    "pytest-xdist>=3.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]

[tool.pyrefly]
python-version = "3.12"
search-path = [".", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -n 4"
testpaths = ["python/tests", "tests"]
