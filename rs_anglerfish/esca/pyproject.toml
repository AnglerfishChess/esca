[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "esca"
description = "A chess model that answers what is true about a position: variants, positions, games, and move text."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Myodov", email = "amyodov@gmail.com" },
]
keywords = ["chess", "chess960", "fen", "san", "position"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/AnglerfishChess/anglerfish"
Repository = "https://github.com/AnglerfishChess/anglerfish"
Documentation = "https://github.com/AnglerfishChess/anglerfish/blob/main/docs/esca-api.md"
Changelog = "https://github.com/AnglerfishChess/anglerfish/blob/main/CHANGELOG.md"
Issues = "https://github.com/AnglerfishChess/anglerfish/issues"

[tool.maturin]
python-source = "python"
module-name = "esca._esca"
features = ["python", "lichess", "pyo3/extension-module"]
